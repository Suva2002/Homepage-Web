<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suvasis · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050311;--ink:#f4f0ff;--dim:#a79fd0;--card:rgba(20,12,48,.42);--line:rgba(170,130,255,.24);--gold:#ff2bd6;--teal:#19f7ff;--v:#8b5cff;--line-c:25,247,255}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:1680px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px) 80px}
.top{display:grid;grid-template-columns:1fr minmax(260px,420px);gap:28px;align-items:end;margin-bottom:clamp(56px,13vh,160px);padding-top:clamp(0px,5vh,64px)}
@media(max-width:760px){.top{grid-template-columns:1fr}}
.clock{font:800 clamp(56px,11vw,120px)/.9 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em}
.clock small{font:300 .3em 'Bricolage Grotesque';color:var(--gold);margin-left:.15em;letter-spacing:0}
.greet{font:500 clamp(16px,2.4vw,22px) 'Bricolage Grotesque';color:var(--dim);margin-top:10px}
.greet b{color:var(--ink);font-weight:800}
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px rgba(var(--line-c),.15)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;min-width:0}
.search kbd{align-self:center;font:12px 'DM Sans';color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--gold);color:#1a1200;border:0;border-radius:11px;padding:8px 16px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(16px,1.6vw,28px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;backdrop-filter:blur(14px);position:relative}
.card h2{font:800 15px 'Bricolage Grotesque';letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h2 i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--teal));box-shadow:0 0 12px var(--c,var(--teal))}
.card h2 .x{margin-left:auto;font-size:12px;background:none;border:0;color:var(--dim);display:none}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.lk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink);border:1px solid transparent;position:relative;transition:background .15s,border-color .15s,transform .15s}
.lk:hover,.lk:focus-visible{background:rgba(var(--line-c),.1);border-color:var(--line);outline:0;transform:translateY(-1px)}
.lk span.a{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 13px 'Bricolage Grotesque';color:#10121f}
.lk span.n{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .d{position:absolute;right:2px;top:2px;background:#ff5d6c;color:#fff;border:0;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;display:none}
.edit .d,.edit .x{display:block}
.wx{grid-column:span 1}
.wx .big{font:800 54px/1 'Bricolage Grotesque';letter-spacing:-.03em}
.wx .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.wx p{color:var(--dim);font-size:13px}
.fc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.fc div{text-align:center;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:6px 0}
.fc b{display:block;color:var(--ink);font-size:14px}
.note{font-size:12.5px;color:var(--dim);margin-top:10px}
.note a{color:var(--gold)}
.bar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.bar button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;backdrop-filter:blur(14px)}
.bar button.on{background:var(--gold);color:#1a1200;border-color:transparent}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(5,6,16,.6);backdrop-filter:blur(4px)}
dialog h3{font:800 18px 'Bricolage Grotesque';margin-bottom:12px}
dialog label{display:block;font-size:13px;color:var(--dim);margin-top:10px}
dialog input,dialog select{width:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
dialog .acts .g{background:none;border:1px solid var(--line);border-radius:11px;padding:8px 14px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 25%,color-mix(in srgb,var(--v) 40%,transparent),transparent 70%),radial-gradient(35% 35% at 80% 20%,color-mix(in srgb,var(--gold) 30%,transparent),transparent 70%),radial-gradient(45% 40% at 60% 95%,color-mix(in srgb,var(--teal) 26%,transparent),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-4%,0) scale(1.08) rotate(3deg)}}
.clock{color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--teal) 75%,transparent),0 0 70px color-mix(in srgb,var(--teal) 45%,transparent)}
.clock small{text-shadow:0 0 16px var(--gold)}
.card{box-shadow:0 0 30px -14px color-mix(in srgb,var(--c) 70%,transparent);transition:box-shadow .25s,border-color .25s}
.card:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 36px -6px color-mix(in srgb,var(--c) 55%,transparent)}
.btn{box-shadow:0 0 18px color-mix(in srgb,var(--gold) 65%,transparent);color:#fff}
.bar button.on{color:#fff}
.hint{display:none;margin-bottom:18px;padding:10px 14px;border:1px dashed var(--gold);border-radius:12px;color:var(--dim);font-size:13.5px}
.edit .hint{display:block}
.tools{display:none;gap:8px}.edit .tools{display:flex}
.lk.add{display:none;background:none;border:1px dashed var(--line);color:var(--dim);font:inherit;cursor:pointer}
.edit .lk.add{display:flex}
.lk.add .a{background:var(--line);color:var(--ink)}
.cb{margin-left:auto;display:none;gap:4px}.edit .cb{display:flex}
.cb button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:13px}
.cb .del{color:#ff6b81;border-color:rgba(255,107,129,.55)}
.edit .card[data-i]{outline:1px dashed var(--line);outline-offset:3px;cursor:grab}
.tt[contenteditable=true]{outline:0;border-bottom:1px dashed var(--dim);cursor:text;min-width:40px}
.card.drag{opacity:.45}
.np{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:76px;width:min(350px,calc(100vw - 32px));max-height:52vh;display:flex;flex-direction:column;z-index:4;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--bg) 38%,transparent);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 0 44px -14px color-mix(in srgb,var(--teal) 55%,transparent)}
.np header{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.np header b{font:800 15px 'Bricolage Grotesque';margin-right:auto}
.np header button{background:none;border:1px solid var(--line);border-radius:8px;width:28px;height:28px;color:var(--dim)}
.bd{background:var(--gold);color:#fff;border-radius:999px;padding:0 9px;font-size:12px;line-height:20px;box-shadow:0 0 12px var(--gold)}
.nl{overflow:auto;min-height:0;padding:0 8px 10px;display:grid;gap:2px;align-content:start}
.np.min .nl{display:none}.np.min{max-height:none}
.ni{display:grid;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.ni:hover{background:rgba(var(--line-c),.08);border-color:var(--line)}
.ni.new{background:rgba(var(--line-c),.12);border-color:var(--line)}
.ni b{font:800 12px 'Bricolage Grotesque'}
.ni span{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni small{color:var(--dim);font-size:12px}
.nl .note{padding:4px 12px}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.cr small{color:var(--dim)}.cr .g{background:none;border:1px solid var(--line);border-radius:9px;padding:3px 10px;color:inherit}
@media(min-width:1560px){main{padding-right:410px}body.npmin main{padding-right:32px}.np{top:clamp(16px,5vh,56px);bottom:auto;max-height:calc(100vh - 150px)}}
.ni{position:relative;padding-right:40px}
.nx{position:absolute;right:8px;top:8px;background:none;border:1px solid var(--line);border-radius:8px;width:24px;height:24px;color:var(--dim);line-height:1}
.nx:hover{color:#ff6b81;border-color:#ff6b81}
#nk{width:auto;padding:0 9px;font-size:12px}
.hero-in{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(8px)}}
@media(prefers-reduced-motion:reduce){.hero-in{animation:none}.lk{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main id="app"><div class="hint">Customize mode: rename a section by clicking its title, drag cards or use ‹ › to reorder, add or delete links and sections.</div>
  <div class="top hero-in">
    <div>
      <div class="clock" id="clock"></div>
      <div class="greet" id="greet"></div>
    </div>
    <form class="search" id="sf">
      <input id="q" placeholder="Search Google or type a URL" autocomplete="off" aria-label="Search">
      <kbd>/</kbd><button class="btn">Go</button>
    </form>
  </div>
  <div class="grid" id="grid">
    <section class="card wx" id="wx" style="--c:#ff9a3c"><h2><i></i>Weather</h2><div id="wxb"><p>Loading…</p></div></section>
    <div id="secs" style="display:contents"></div>
  </div>
</main>
<div class="bar">
  <button id="th" aria-label="Change neon palette">Palette</button>
  <span class="tools"><button id="as">+ Section</button></span>
  <button id="ed">Customize</button>
</div>
<aside class="np" id="np" aria-label="Notifications"><header><b>Notifications</b><span class="bd" id="nc">0</span><button id="nn" title="Add reminder" aria-label="Add reminder">+</button><button id="nb" title="Desktop alerts" aria-label="Desktop alerts">🔔</button><button id="nk" title="Clear all" aria-label="Clear all">Clear</button><button id="nm" aria-label="Minimise">–</button></header><div class="nl" id="nl"></div></aside>
<dialog id="dl"><form method="dialog" id="df"></form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DEF=[
{t:'Travel',c:'#ffd23f',l:[['IRCTC','https://www.irctc.co.in'],['Ixigo','https://www.ixigo.com'],['MakeMyTrip','https://www.makemytrip.com'],['Google Flights','https://www.google.com/travel/flights'],['RedBus','https://www.redbus.in'],['Where is my Train','https://whereismytrain.in']]},
{t:'Maps & Local',c:'#19f7ff',l:[['Google Maps','https://maps.google.com'],['Bhuvan','https://bhuvan.nrsc.gov.in'],['Zomato','https://www.zomato.com'],['Swiggy','https://www.swiggy.com'],['Uber','https://m.uber.com']]},
{t:'Indian Markets',c:'#ff2bd6',l:[['NSE India','https://www.nseindia.com'],['BSE','https://www.bseindia.com'],['Moneycontrol','https://www.moneycontrol.com'],['Screener','https://www.screener.in'],['TradingView','https://in.tradingview.com/markets/'],['Zerodha Kite','https://kite.zerodha.com']]},
{t:'SAP Dev',c:'#8b5cff',l:[['SAP Help','https://help.sap.com'],['SAP Community','https://community.sap.com'],['UI5 SDK','https://ui5.sap.com'],['API Hub','https://api.sap.com'],['ABAP Cheat Sheets','https://github.com/SAP-samples/abap-cheat-sheets'],['GitHub','https://github.com']]},
{t:'Daily',c:'#3dffa2',l:[['Gmail','https://mail.google.com'],['Calendar','https://calendar.google.com'],['Drive','https://drive.google.com'],['YouTube','https://www.youtube.com'],['ChatGPT','https://chat.openai.com'],['Claude','https://claude.ai']]}
];
let S;try{S=JSON.parse(localStorage.getItem('home-v2'))}catch(e){}
S=S||DEF;
const save=()=>{try{localStorage.setItem('home-v2',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};

const P=[{t:'#19f7ff',g:'#ff2bd6',v:'#8b5cff'},{t:'#ff9a3c',g:'#ff3d81',v:'#a855f7'},{t:'#3dffa2',g:'#22d3ee',v:'#7c3aed'}];
let pi=0,recolor=null;try{pi=+localStorage.getItem('home-pal')||0}catch(e){}
function pal(){const p=P[pi],r=document.documentElement.style,n=parseInt(p.t.slice(1),16);
  r.setProperty('--teal',p.t);r.setProperty('--gold',p.g);r.setProperty('--v',p.v);r.setProperty('--line-c',(n>>16)+','+((n>>8)&255)+','+(n&255));if(recolor)recolor()}
pal();
const ED=()=>document.body.classList.contains('edit');
function render(){
  $('secs').innerHTML=S.map((s,i)=>`<section class="card" data-i="${i}" draggable="${ED()}" style="--c:${s.c}"><h2><i></i><span class="tt" data-t="${i}" contenteditable="${ED()}" spellcheck="false">${esc(s.t)}</span><span class="cb"><button data-mv="${i},-1" aria-label="Move earlier">‹</button><button data-mv="${i},1" aria-label="Move later">›</button><button class="del" data-rs="${i}">Delete</button></span></h2><div class="links">${
    s.l.map((k,j)=>`<a class="lk" href="${esc(k[1])}" rel="noopener"><span class="a" style="background:hsl(${hue(k[0])} 100% 62%);box-shadow:0 0 14px hsl(${hue(k[0])} 100% 60%/.5)">${esc(k[0][0].toUpperCase())}</span><span class="n">${esc(k[0])}</span><button class="d" data-rl="${i},${j}" aria-label="Remove ${esc(k[0])}">×</button></a>`).join('')
  }<button class="lk add" data-al="${i}"><span class="a">+</span><span class="n">Add link</span></button></div></section>`).join('');
}
function setEd(on){document.body.classList.toggle('edit',on);$('ed').classList.toggle('on',on);$('ed').textContent=on?'Done':'Customize';render()}
$('ed').onclick=()=>setEd(!ED());
addEventListener('keydown',e=>{if(e.key==='Escape'&&ED()&&!$('dl').open)setEd(false)});
const G=$('grid');
G.addEventListener('click',e=>{
  const t=e.target,rl=t.closest('[data-rl]'),rs=t.closest('[data-rs]'),al=t.closest('[data-al]'),mv=t.closest('[data-mv]');
  if(ED()&&t.closest('a.lk'))e.preventDefault();
  if(rl){const[i,j]=rl.dataset.rl.split(',');S[i].l.splice(j,1);save();render()}
  else if(rs){if(rs.dataset.sure){S.splice(+rs.dataset.rs,1);save();render()}else{rs.dataset.sure=1;rs.textContent='Sure?';setTimeout(()=>{rs.dataset.sure='';rs.textContent='Delete'},2500)}}
  else if(al)askLink(+al.dataset.al);
  else if(mv){const[i,d]=mv.dataset.mv.split(',').map(Number),k=i+d;if(k>=0&&k<S.length){[S[i],S[k]]=[S[k],S[i]];save();render()}}
});
G.addEventListener('focusout',e=>{const t=e.target.closest&&e.target.closest('[data-t]');if(t){S[t.dataset.t].t=t.textContent.trim()||'Untitled';save()}});
G.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.t!=null){e.preventDefault();e.target.blur()}});
let dg=null;
G.addEventListener('dragstart',e=>{const c=e.target.closest('.card[data-i]');if(!ED()||!c||e.target.closest('a')){e.preventDefault();return}dg=+c.dataset.i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','s');c.classList.add('drag')});
G.addEventListener('dragover',e=>{if(dg!==null)e.preventDefault()});
G.addEventListener('drop',e=>{const c=e.target.closest('.card[data-i]');if(dg===null||!c)return;e.preventDefault();const[m]=S.splice(dg,1);S.splice(+c.dataset.i,0,m);dg=null;save();render()});
G.addEventListener('dragend',()=>{dg=null;render()});

function dlg(html,ok){const f=$('df');f.innerHTML=html+'<div class="acts"><button type="button" class="g" id="cx">Cancel</button><button class="btn">Save</button></div>';
  $('dl').showModal();$('cx').onclick=()=>$('dl').close();
  f.onsubmit=ev=>{ev.preventDefault();ok(new FormData(f));$('dl').close()}}
function askLink(i){dlg(`<h3>Add link to ${esc(S[i].t)}</h3><label>Name<input name="n" required maxlength="24"></label><label>URL<input name="u" required placeholder="example.com"></label>`,d=>{
  let u=d.get('u').trim();if(!/^https?:\/\//.test(u))u='https://'+u;S[i].l.push([d.get('n').trim(),u]);save();render()})}
$('as').onclick=()=>dlg(`<h3>New section</h3><label>Section name<input name="t" required maxlength="24"></label>`,d=>{
  const cs=['#ffd23f','#19f7ff','#ff2bd6','#8b5cff','#3dffa2','#ff9a3c'];S.push({t:d.get('t').trim(),c:cs[S.length%cs.length],l:[]});save();render()});
$('th').onclick=()=>{pi=(pi+1)%P.length;try{localStorage.setItem('home-pal',pi)}catch(e){}pal()};

/* system notifications: generated by the page itself, each can be cleared */
let N=[],R=[],first=false,desk=false;
try{first=localStorage.getItem('home-notes')===null;N=JSON.parse(localStorage.getItem('home-notes'))||[];R=JSON.parse(localStorage.getItem('home-rem'))||[];desk=localStorage.getItem('home-desk')==='1'&&window.Notification&&Notification.permission==='granted'}catch(e){}
const saveN=()=>{try{localStorage.setItem('home-notes',JSON.stringify(N));localStorage.setItem('home-rem',JSON.stringify(R))}catch(e){}};
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'};
function notify(src,t,s,col){
  N.unshift({id:Date.now()*1000+Math.floor(Math.random()*1000),src,t,s:s||'',col:col||'#19f7ff',at:Date.now()});N=N.slice(0,40);saveN();paint();
  if(desk)try{new Notification(src+': '+t,{body:s||''})}catch(e){}
}
function paint(){
  $('nc').textContent=N.length;
  $('nl').innerHTML=N.length?N.map(i=>`<div class="ni"><b style="color:${i.col}">${esc(i.src)}</b><span>${esc(i.t)}</span><small>${esc(i.s)}${i.s?' · ':''}${ago(i.at)} ago</small><button class="nx" data-x="${i.id}" aria-label="Clear notification">×</button></div>`).join(''):'<p class="note">You are all caught up.</p>';
  document.title=(N.length?'('+N.length+') ':'')+'Suvasis · Home';
}
$('nl').addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(x){N=N.filter(i=>String(i.id)!==x.dataset.x);saveN();paint()}});
$('nk').onclick=()=>{N=[];saveN();paint()};
const bell=()=>{$('nb').style.opacity=desk?1:.45;$('nb').title=desk?'Desktop alerts on':'Desktop alerts off'};
$('nb').onclick=async()=>{
  if(desk){desk=false;try{localStorage.setItem('home-desk','0')}catch(e){}bell();return}
  if(!window.Notification){notify('System','This browser has no desktop alerts','','#ff6b81');return}
  const p=await Notification.requestPermission();desk=p==='granted';
  try{localStorage.setItem('home-desk',desk?'1':'0')}catch(e){}bell();
  notify('System',desk?'Desktop alerts are on':'Desktop alerts are blocked in browser settings','',desk?'#3dffa2':'#ff6b81');
};
$('nn').onclick=()=>dlg('<h3>New reminder</h3><label>Remind me to<input name="t" required maxlength="80"></label><label>When<input name="w" type="datetime-local" required></label>',d=>{R.push({t:d.get('t').trim(),at:+new Date(d.get('w'))});saveN();checkR()});
function checkR(){const n=Date.now(),due=R.filter(r=>r.at<=n);if(!due.length)return;R=R.filter(r=>r.at>n);due.forEach(r=>notify('Reminder',r.t,'','#ffd23f'))}
function wxAlert(c){let m=null;
  if(c.temperature_2m>=40)m=['Heat alert: '+Math.round(c.temperature_2m)+'°C in New Delhi','Stay hydrated'];
  else if([61,63,65,80,81,82,95,96,99].includes(c.weather_code))m=['Rain expected in New Delhi','Carry an umbrella'];
  if(!m)return;const k=new Date().toDateString()+m[0];
  try{if(localStorage.getItem('home-wx')===k)return;localStorage.setItem('home-wx',k)}catch(e){}
  notify('Weather',m[0],m[1],'#ff9a3c')}
addEventListener('offline',()=>notify('Network','You are offline','Some widgets may not update','#ff6b81'));

try{navigator.getBattery&&navigator.getBattery().then(b=>{let low=false;const chk=()=>{if(b.level<=.2&&!b.charging){if(!low){low=true;notify('Battery','Battery at '+Math.round(b.level*100)+'%','Plug in your charger','#ff9a3c')}}else low=false};b.addEventListener('levelchange',chk);b.addEventListener('chargingchange',chk);chk()})}catch(e){}

/* clock + greeting */
function tick(){const d=new Date();let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
  $('clock').innerHTML=h+':'+String(d.getMinutes()).padStart(2,'0')+'<small>'+ap+'</small>';
  const hr=d.getHours(),g=hr<5?'Still up':hr<12?'Good morning':hr<17?'Good afternoon':hr<21?'Good evening':'Good night';
  $('greet').innerHTML='<b>'+g+', Suvasis.</b> '+d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,15000);

/* weather via Open-Meteo (works when this file is opened locally / hosted on your own site) */
const WC={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
async function weather(){
  const b=$('wxb');
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=28.61&longitude=77.21&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=5');
    const j=await r.json(),c=j.current,d=j.daily;wxAlert(c);
    b.innerHTML=`<div class="row"><div class="big">${Math.round(c.temperature_2m)}°</div><div style="text-align:right"><b>New Delhi</b><p>${WC[c.weather_code]||'—'} · feels ${Math.round(c.apparent_temperature)}°<br>Humidity ${c.relative_humidity_2m}%</p></div></div><div class="fc">${[1,2,3,4].map(i=>`<div>${new Date(d.time[i]).toLocaleDateString('en-IN',{weekday:'short'})}<b>${Math.round(d.temperature_2m_max[i])}°</b>${Math.round(d.temperature_2m_min[i])}°</div>`).join('')}</div>`;
  }catch(e){
    b.innerHTML='<p>Live weather loads when this page runs from your own machine or site.</p><p class="note"><a href="https://www.google.com/search?q=weather+new+delhi">Open weather for New Delhi</a> · <a href="https://mausam.imd.gov.in">IMD</a></p>';
  }
}

/* three.js: neon particles flying through space */
(function(){
  if(!window.THREE)return;
  const cv=$('bg'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true}),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
  const sc=new THREE.Scene();sc.fog=new THREE.FogExp2(0x050311,.0055);
  const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,400);
  const N=innerWidth<700?1300:2600,pos=new Float32Array(N*3),col=new Float32Array(N*3),spd=new Float32Array(N),own=new Float32Array(N);
  const seed=(i,z)=>{const a=Math.random()*6.283,r=3+Math.pow(Math.random(),.7)*70;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.sin(a)*r*.6;pos[i*3+2]=z};
  for(let i=0;i<N;i++){seed(i,-4-Math.random()*300);spd[i]=.35+Math.random()*1.1;own[i]=Math.random()}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const c2=document.createElement('canvas');c2.width=c2.height=64;const x=c2.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,64,64);
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.5,map:new THREE.CanvasTexture(c2),vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  sc.add(pts);
  recolor=()=>{const p=P[pi],cs=[p.t,p.g,p.v].map(h=>new THREE.Color(h));
    for(let i=0;i<N;i++){const c=cs[own[i]<.45?0:own[i]<.8?1:2];col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}g.attributes.color.needsUpdate=true};
  recolor();
  let tx=0,ty=0;addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*10;ty=-(e.clientY/innerHeight-.5)*6});
  addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
  function loop(){
    for(let i=0;i<N;i++){pos[i*3+2]+=spd[i]*.45*(reduce?.3:1);if(pos[i*3+2]>-2)seed(i,-300)}
    g.attributes.position.needsUpdate=true;
    sc.rotation.z+=.0005;cam.position.x+=(tx-cam.position.x)*.04;cam.position.y+=(ty-cam.position.y)*.04;
    R.render(sc,cam);requestAnimationFrame(loop)}
  loop();
})();
render();
